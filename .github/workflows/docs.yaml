name: docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - install.sh
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history gives every page its last modified date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Hugo downloads its modules with Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build
        working-directory: site
        run: hugo build --gc --minify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
