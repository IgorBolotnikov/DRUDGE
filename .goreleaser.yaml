version: 2

# The test hook and the builds share these, so the linux/amd64 build reuses
# the packages the tests compiled.
env:
  - CGO_ENABLED=0
  - GOFLAGS=-trimpath

before:
  hooks:
    - go test ./...

builds:
  - id: drg
    main: ./cmd/drg
    binary: drg
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "drg_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
